<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<title>Pilotage</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icon-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilotage">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html, body { margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #06080c; }
/* Concept : cockpit sombre et minimal. Barre latérale d'onglets filtrée par code d'accès, une grande zone de travail, filets fins, un accent bleu glace dont la teinte change selon le restaurant. */
@property --h { syntax: "<number>"; inherits: true; initial-value: 245; }
:root {
  --h: 245; --pl: 0.58; --pcc: 0.2; --rvif: #ff1f3d; --rfonce: #9c0f1e;
  --bg: #f3f5f8; --panel: #ffffff; --panel-2: #eaeef4; --line: #d5dce7; --fg: #121823; --muted: #5d6b82; --grid: rgba(18,24,35,.045);
  --accent: oklch(0.52 0.17 var(--h)); --accent-soft: oklch(0.93 0.04 var(--h)); --glow: oklch(0.52 0.17 var(--h) / .14);
  --bubble: oklch(0.52 0.17 var(--h) / .22); --halo: oklch(0.6 0.15 var(--h) / .10); --live: #1f9d5c; --warn: #b86e00; --ora: #e0580c;
  --font-ui: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #06080c; --panel: #0b0f16; --panel-2: #101620; --line: #1b2433; --fg: #e8eef8; --muted: #7a889f; --grid: rgba(232,238,248,.035);
    --accent: oklch(0.82 0.11 var(--h)); --accent-soft: oklch(0.25 0.05 var(--h)); --glow: oklch(0.82 0.11 var(--h) / .16);
    --bubble: oklch(0.82 0.11 var(--h) / .3); --halo: oklch(0.82 0.11 var(--h) / .09); --live: #46d68a; --warn: #f0b13a; --ora: #ff8a3d; --pl: 0.8; --pcc: 0.15; color-scheme: dark; }
}
/* dark */
:root[data-theme="dark"] { --bg: #06080c; --panel: #0b0f16; --panel-2: #101620; --line: #1b2433; --fg: #e8eef8; --muted: #7a889f; --grid: rgba(232,238,248,.035);
  --accent: oklch(0.82 0.11 var(--h)); --accent-soft: oklch(0.25 0.05 var(--h)); --glow: oklch(0.82 0.11 var(--h) / .16);
  --bubble: oklch(0.82 0.11 var(--h) / .3); --halo: oklch(0.82 0.11 var(--h) / .09); --live: #46d68a; --warn: #f0b13a; --ora: #ff8a3d; --pl: 0.8; --pcc: 0.15; color-scheme: dark; }
:root[data-resto="905"] { --h: 290; }
:root[data-resto="525"] { --h: 228; }
:root[data-resto="649"] { --h: 172; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; font-weight: 400;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 44px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
#halo { position: fixed; inset: 0; pointer-events: none; z-index: 30; opacity: 0; transition: opacity .4s; --hx: 50%; --hy: 50%;
  background: radial-gradient(460px circle at var(--hx) var(--hy), var(--halo), transparent 70%); }
#halo.on { opacity: 1; }

/* Écran de code */
.login { min-height: calc(100vh - 80px); display: grid; place-items: center; }
.login-box { width: min(440px, 100%); display: grid; gap: 22px; }
.mark { display: flex; align-items: center; gap: 12px; }
.mark i { width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 50%; position: relative; flex: none; box-shadow: 0 0 18px var(--glow); }
.mark i::after { content: ""; position: absolute; inset: 3px; background: var(--accent); border-radius: 50%; }
.mark b { font-weight: 600; letter-spacing: .14em; font-size: 14px; }
.login h1 { margin: 0; font-weight: 300; font-size: clamp(30px, 7vw, 44px); line-height: 1.08; letter-spacing: -.02em; text-wrap: balance; }
.field { display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 14px; padding: 13px 16px; font-family: var(--font-mono); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
.field input::placeholder { color: var(--muted); letter-spacing: .08em; }
.btn { background: var(--accent); color: var(--bg); border: 0; border-radius: 999px; padding: 0 24px; font-weight: 500; }
.err { color: #e5484d; font-size: 13px; min-height: 18px; margin: -10px 0 0; }
.demo { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--fg); }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* Cockpit */
.app { display: grid; grid-template-columns: 276px minmax(0, 1fr); gap: 20px; max-width: 1280px; margin: 0 auto; }
.side { position: sticky; top: 20px; align-self: start; max-height: calc(100vh - 40px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 22px 14px 16px; display: grid; gap: 18px; }
.side .mark { padding: 0 8px; }
.who { margin: 0 8px; padding: 10px 12px; background: var(--panel-2); border-radius: 16px; display: grid; gap: 2px; }
.who strong { font-weight: 500; font-size: 14px; }
.legend { margin: -6px 8px 0; display: flex; align-items: center; gap: 8px; }
.grp { display: grid; gap: 2px; }
.grp > .mono { padding: 0 10px 6px; }
.tab { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; background: transparent; border: 0; border-radius: 14px; padding: 10px 14px; color: var(--muted); position: relative; overflow: hidden; --mx: 20px; --my: 50%; }
.tab::before, .dot { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: none; position: relative; z-index: 1; display: inline-block; }
.tab > span { position: relative; z-index: 1; }
.tab::after { content: ""; position: absolute; left: var(--mx); top: var(--my); width: 190px; height: 190px; border-radius: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(circle, var(--bubble) 0%, transparent 68%); transform: translate(-50%, -50%) scale(0); }
.tab:hover { color: var(--fg); }
.tab:hover::after { transform: translate(-50%, -50%) scale(1); }
.tab[aria-current="page"] { color: var(--fg); background: var(--accent-soft); }
.tab[aria-current="page"]::before { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.tab.live::before, .dot.live { background: var(--live); box-shadow: 0 0 0 0 var(--live); }

.out { margin: 0 8px; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px; color: var(--muted); font-size: 13px; }
.out:hover { color: var(--fg); border-color: var(--muted); }

.main { min-width: 0; display: grid; gap: 18px; align-content: start; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; padding: 6px 2px 16px; border-bottom: 1px solid var(--line); position: relative; }
.head::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 88px; height: 1px; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.head h2 { margin: 4px 0 0; font-weight: 300; font-size: clamp(28px, 5vw, 40px); letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.scope { display: flex; gap: 6px; flex-wrap: wrap; }
.scope button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.scope button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.scope .fixed { border-color: var(--line); color: var(--fg); background: var(--panel); cursor: default; }
.modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.mod { min-height: 210px; background: var(--panel); border: 1px dashed var(--line); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }
.mod:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 30px -12px var(--glow), 0 0 0 1px var(--accent) inset; }
.mod h3 { margin: 0; font-weight: 500; font-size: 15px; }
.mod p { margin: 0; }
.note { color: var(--muted); font-size: 13px; max-width: 62ch; margin: 0; }
.pill { display: inline-flex; align-items: center; gap: 8px; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--muted); }
.sim { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }

/* Bulle sous la souris : filtres, boutons d'aperçu et cases cliquables (classe clic) */
.scope button:not(.fixed), .chip, .out, .mod.clic { position: relative; overflow: hidden; isolation: isolate; --mx: 50%; --my: 50%; }
.scope button:not(.fixed)::after, .chip::after, .out::after, .mod.clic::after { content: ""; position: absolute; left: var(--mx); top: var(--my); width: 170px; height: 170px; border-radius: 50%; pointer-events: none; z-index: -1;
  background: radial-gradient(circle, var(--bubble) 0%, transparent 68%); transform: translate(-50%, -50%) scale(0); }
.scope button:not(.fixed):hover::after, .chip:hover::after, .out:hover::after, .mod.clic:hover::after { transform: translate(-50%, -50%) scale(1); }
.mod.clic { cursor: pointer; }
.mod.clic::after { width: 300px; height: 300px; }

/* Rail de pôles : pastilles rondes à gauche, les onglets du pôle choisi sortent à droite */
.sidebody { min-width: 0; display: grid; gap: 18px; align-content: start; }
/* Une couleur par pôle : la pastille, le titre du pôle et ses onglets la reprennent */
.rb, .pp { --po: 48; --pc: oklch(var(--pl) var(--pcc) var(--ph)); --pc-soft: oklch(var(--pl) var(--pcc) var(--ph) / .16); --pc-bubble: oklch(var(--pl) var(--pcc) var(--ph) / .32);
  --pc-b: oklch(var(--pl) var(--pcc) calc(var(--ph) + var(--po))); }
[data-pl="ops"] { --ph: 238; }
[data-pl="rh"] { --ph: 335; }
[data-pl="maint"] { --ph: 82; --po: -26; }
[data-pl="equipe"] { --ph: 285; }
[data-pl="form"] { --ph: 22; }
[data-pl="rhadm"] { --ph: 190; }
.pp { --accent: var(--pc); --accent-soft: var(--pc-soft); --bubble: var(--pc-bubble); }
.pp > .mono { color: var(--pc); }
.rail { display: flex; justify-content: space-between; gap: 6px; padding: 0 8px; }
.rail.dense { flex-wrap: wrap; justify-content: flex-start; gap: 10px 8px; }
.rb { position: relative; width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid oklch(var(--pl) var(--pcc) var(--ph) / .5); background: linear-gradient(150deg, oklch(var(--pl) var(--pcc) var(--ph) / .13), transparent 70%); color: var(--pc); display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; overflow: hidden; isolation: isolate; --mx: 50%; --my: 50%; padding: 0; }
.rb span { position: relative; z-index: 1; }
.rb:hover { border-color: var(--pc); }
.rb.has { border-color: var(--pc); }
.rb.open { background: linear-gradient(150deg, oklch(var(--pl) var(--pcc) var(--ph) / .42), oklch(var(--pl) var(--pcc) calc(var(--ph) + var(--po)) / .2)); border-color: var(--pc); box-shadow: 0 0 22px oklch(var(--pl) var(--pcc) var(--ph) / .35); font-weight: 500; }
.rb .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; display: none; }
.rb.live .dot { display: block; background: var(--live); box-shadow: 0 0 0 0 var(--live); }
.rb::after { content: ""; position: absolute; left: var(--mx); top: var(--my); width: 120px; height: 120px; border-radius: 50%; pointer-events: none; z-index: -1;
  background: radial-gradient(circle, var(--pc-bubble) 0%, transparent 68%); transform: translate(-50%, -50%) scale(0); }
.rb:hover::after { transform: translate(-50%, -50%) scale(1); }
.pps { display: grid; }
.pp { grid-area: 1 / 1; display: grid; gap: 2px; align-content: start; opacity: 0; visibility: hidden; transform: translateY(-6px); }
.pp.open { opacity: 1; visibility: visible; transform: none; }
.pp > .mono { padding: 0 14px 6px; }

/* Badges d'alerte : rouge vif = robot en erreur, rouge foncé = alerte de contenu à traiter */
.bd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: #fff; line-height: 1; position: relative; z-index: 1; flex: none; box-shadow: 0 0 0 2px var(--panel); }
.bd.rv { background: var(--rvif); }
.bd.rf { background: var(--rfonce); outline: 1px solid rgba(255,255,255,.55); outline-offset: -3px; }
.tab .bds { margin-left: auto; display: inline-flex; gap: 4px; position: relative; z-index: 1; }
.rbw { position: relative; flex: none; }
.rbw .bds { position: absolute; top: -6px; left: -6px; display: grid; gap: 2px; z-index: 3; }
.rbw .bd { min-width: 17px; height: 17px; font-size: 10px; padding: 0 4px; }
.legend2 { display: grid; gap: 6px; margin: -6px 8px 0; }
.legend2 span { display: flex; align-items: center; gap: 8px; }
.legend2 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.foot { display: flex; align-items: center; gap: 8px; }
.foot .out { flex: 1; margin: 0 0 0 8px; }
.themebtn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 12px; color: var(--muted); font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; margin-right: 8px; white-space: nowrap; }
.themebtn:hover { color: var(--fg); border-color: var(--muted); }

/* Panneau de détail à droite */
#scrim { position: fixed; inset: 0; background: rgba(4,7,12,.45); opacity: 0; visibility: hidden; z-index: 40; }
#scrim.on { opacity: 1; visibility: visible; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100%); z-index: 41; background: var(--panel); border-left: 1px solid var(--line); border-radius: 28px 0 0 28px;
  padding: 28px max(24px, env(safe-area-inset-right, 0px)) 28px 26px; padding-top: calc(28px + env(safe-area-inset-top, 0px)); display: grid; gap: 14px; align-content: start; transform: translateX(105%); visibility: hidden; overflow-y: auto; }
#drawer.on { transform: none; visibility: visible; box-shadow: -30px 0 60px -30px rgba(0,0,0,.5); }
#drawer h3 { margin: 0; font-weight: 300; font-size: 30px; letter-spacing: -.02em; line-height: 1.12; }
#dclose { justify-self: end; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
#dclose:hover { color: var(--fg); border-color: var(--muted); }
.dline { height: 12px; border-radius: 999px; background: var(--panel-2); }
.dline:nth-child(2) { width: 82%; } .dline:nth-child(3) { width: 64%; }
.dnote { color: var(--muted); font-size: 13px; margin: 0; }

/* Cartes : valeur, écart de comparaison, ancienneté */
.val { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
.val b { font-family: var(--font-mono); font-weight: 500; font-size: 30px; letter-spacing: -.02em; line-height: 1; }
.delta { font-family: var(--font-mono); font-size: 11px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; letter-spacing: .02em; white-space: nowrap; }
.delta.up { color: var(--live); } .delta.down { color: var(--warn); }
.foot2 { display: grid; justify-items: start; gap: 5px; }
.foot2 .mono { white-space: nowrap; }
.fresh { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.mod.stale { filter: grayscale(1); opacity: .5; }
.mod.stale:hover { opacity: .8; }

/* Boutons de l'en-tête */
.hright { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.hbtn { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); position: relative; overflow: hidden; isolation: isolate; --mx: 50%; --my: 50%; }
.hbtn:hover { color: var(--fg); border-color: var(--muted); }
.hbtn.has { color: var(--fg); border-color: var(--rfonce); }
.hbtn::after { content: ""; position: absolute; left: var(--mx); top: var(--my); width: 150px; height: 150px; border-radius: 50%; pointer-events: none; z-index: -1;
  background: radial-gradient(circle, var(--bubble) 0%, transparent 68%); transform: translate(-50%, -50%) scale(0); }
.hbtn:hover::after { transform: translate(-50%, -50%) scale(1); }
.hbtn .bd { box-shadow: none; }
.pillcount { border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 11px; }

/* Consignes */
#dbody { display: grid; gap: 14px; align-content: start; }
#dbody h3 + .mono { margin-top: -6px; }
.cform { display: grid; gap: 10px; padding: 16px; border: 1px dashed var(--line); border-radius: 20px; }
.cform label { display: grid; gap: 4px; }
.cform select, .cform textarea, .cform input[type="date"], .cs-note { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
.cform textarea { resize: vertical; min-height: 76px; }
.chk { display: flex !important; align-items: center; gap: 10px !important; grid-auto-flow: column; justify-content: start; }
.btn.small { padding: 9px 22px; }
.cs { display: grid; gap: 8px; padding: 16px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 20px; }
.cs.urg { border-color: var(--rfonce); box-shadow: 0 0 0 1px var(--rfonce) inset; }
.cs.faite { opacity: .55; }
.cs p { margin: 0; font-size: 15px; }
.cs-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cs-st { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); }
.cs-st.vue { color: var(--accent); border-color: var(--accent); }
.cs-st.faite { color: var(--live); border-color: var(--live); }
.late { color: #fff; background: var(--rfonce); border-radius: 999px; padding: 1px 8px; font-weight: 500; margin-left: 6px; }
.urgtag { color: #fff; background: var(--rfonce); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
.cs-act { display: flex; gap: 8px; }
.cs-link { background: transparent; border: 0; padding: 0; color: var(--accent); font-family: var(--font-mono); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }
.cs-del { background: transparent; border: 0; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }

/* Calendrier rond pour l'échéance */
.dp { display: grid; gap: 8px; }
.dpbtn { width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
.dpbtn:hover, .dpbtn[aria-expanded="true"] { border-color: var(--accent); }
.dpq { display: flex; flex-wrap: wrap; gap: 6px; }
.dpcal { background: var(--panel-2); border: 1px solid var(--line); border-radius: 26px; padding: 14px; display: grid; gap: 8px; }
.dpcal[hidden] { display: none; }
.dph { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dph b { font-weight: 500; text-transform: capitalize; }
.dpn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
.dpn:hover { color: var(--fg); border-color: var(--accent); }
.dpg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dpg .wd { text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--muted); padding: 2px 0 4px; }
.dpd { aspect-ratio: 1; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--fg); font-family: var(--font-mono); font-size: 12px; padding: 0; }
.dpd:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
.dpd.auj { border-color: var(--muted); }

/* ---------- Valeurs d'exemple : écart de comparaison et ancienneté ---------- */
function hachage(t) { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function exemple(nom, ongletId) {
  const P = PERIODES[periode], h = hachage(nom + ongletId + periode + (jourRef || '')), n = P.n;
  const v = 10 + (h % 9000) / 100, val = fmtNum(v);
  const dPrev = (((h >>> 3) % 140) / 10 - 5), dN1 = ((hachage(nom + ongletId + 'n1' + periode) % 200) / 10 - 8);
  const d = comparer === 'N-1' ? dN1 : dPrev, delta = (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1).replace('.', ',') + ' %';
  const heures = [0.3, 1, 2, 3, 5, 8, 12, 20, 30, 52][(h >>> 5) % 10];
  const fraicheur = jourRef ? 'au ' + fmtCourt(jourRef) : heures < 1 ? 'il y a ' + Math.round(heures * 60) + ' min' : heures < 24 ? 'il y a ' + heures + ' h' : 'il y a ' + Math.floor(heures / 24) + ' j';
  const serie = new Array(n); serie[n - 1] = v; serie[n - 2] = v / (1 + dPrev / 100);
  for (let k = n - 3; k >= 0; k--) serie[k] = serie[k + 1] * (1 + ((((h >>> (7 + k)) % 21) - 10) / 100));
  const obj0 = Math.round(v * (0.88 + ((h >>> 13) % 31) / 100) * 10) / 10;
  return { val, v, delta, up: d >= 0, fraicheur, stale: !jourRef && heures > 24, serie, obj0 };
}

function initCalendrier() {

  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

  function choisir(v) { champ.value = v || ''; btn.textContent = v ? fmtDate(v) : 'Sans échéance'; cal.hidden = true; btn.setAttribute('aria-expanded', 'false'); }

    let h = `<div class="dph"><button type="button" class="dpn" data-m="-1" aria-label="Mois précédent">‹</button><b>${MOIS[mo]} ${an}</b><button type="button" class="dpn" data-m="1" aria-label="Mois suivant">›</button></div><div class="dpg">`;

/* ---------- Glisser-déposer des cases : appui long, la case se décroche et se balance sous le pointeur ---------- */
let noClick = 0;
(function () {
  const SEL = 'section.modules > .mod.clic';
  let timer = null, depart = null, d = null;
  const annuler = () => { clearTimeout(timer); if (depart) depart.card.classList.remove('armed'); depart = null; };
  root.addEventListener('contextmenu', e => { if (e.target.closest(SEL)) e.preventDefault(); });
  root.addEventListener('pointerdown', e => {
    if ((e.pointerType === 'mouse' && e.button !== 0) || reunion || d) return;
    const card = e.target.closest(SEL); if (!card || e.target.closest('a')) return;
    annuler(); depart = { x: e.clientX, y: e.clientY, card, id: e.pointerId };
    card.classList.add('armed');
    timer = setTimeout(demarrer, 380);
  });
  document.addEventListener('pointermove', e => {
    if (depart && !d && Math.hypot(e.clientX - depart.x, e.clientY - depart.y) > 8) annuler();
    if (d) { d.px = e.clientX; d.py = e.clientY; reordonner(); }
  });
  document.addEventListener('touchmove', e => { if (d) e.preventDefault(); }, { passive: false });
  document.addEventListener('pointerup', () => { if (d) poser(); else annuler(); });
  document.addEventListener('pointercancel', () => { if (d) poser(); else annuler(); });
  function demarrer() {
    if (!depart) return;
    const card = depart.card, r = card.getBoundingClientRect(), parent = card.parentElement;
    const ph = document.createElement('div'); ph.className = 'mod ph'; ph.style.height = r.height + 'px';
    parent.insertBefore(ph, card);
    d = { card, ph, parent, px: depart.x, py: depart.y, lastPx: depart.x, grab: { x: depart.x - r.left, y: depart.y - r.top }, ang: 0, sc: 1, raf: 0 };
    card.classList.remove('armed'); card.classList.add('drag');
    Object.assign(card.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', transformOrigin: d.grab.x + 'px ' + d.grab.y + 'px', transition: 'none' });
    try { card.setPointerCapture(depart.id); } catch (e) {}
    depart = null; document.body.classList.add('glisse');
    boucle();
  }
  function boucle() {
    if (!d) return;
    d.card.style.left = (d.px - d.grab.x) + 'px'; d.card.style.top = (d.py - d.grab.y) + 'px';
    const vx = d.px - d.lastPx; d.lastPx = d.px;
    const cible = Math.max(-14, Math.min(14, vx * 0.9)) - 3;
    d.ang += (cible - d.ang) * 0.18; d.sc += (1.04 - d.sc) * 0.2;
    d.card.style.transform = 'rotate(' + d.ang.toFixed(2) + 'deg) scale(' + d.sc.toFixed(3) + ')';
    if (d.py < 70) scrollBy(0, -12); else if (d.py > innerHeight - 70) scrollBy(0, 12);
    reordonner();
    d.raf = requestAnimationFrame(boucle);
  }
  function reordonner() {
    if (!d) return;
    const autres = [...d.parent.children].filter(x => x !== d.card && x !== d.ph && x.classList.contains('clic'));
    const sous = autres.find(x => { const r = x.getBoundingClientRect(); return d.px >= r.left && d.px <= r.right && d.py >= r.top && d.py <= r.bottom; });
    if (sous) { const r = sous.getBoundingClientRect(); d.parent.insertBefore(d.ph, d.px < r.left + r.width / 2 ? sous : sous.nextSibling); }
  }
  function poser() {
    const x = d; d = null; cancelAnimationFrame(x.raf);
    const r = x.ph.getBoundingClientRect();
    x.card.style.transition = 'left .26s cubic-bezier(.2,.8,.2,1), top .26s cubic-bezier(.2,.8,.2,1), transform .26s cubic-bezier(.2,.8,.2,1)';
    x.card.style.left = r.left + 'px'; x.card.style.top = r.top + 'px'; x.card.style.transform = 'none';
    setTimeout(() => {
      x.card.classList.remove('drag'); ['left', 'top', 'width', 'height', 'transform', 'transformOrigin', 'transition'].forEach(k => { x.card.style[k] = ''; });
      x.parent.insertBefore(x.card, x.ph); x.ph.remove(); document.body.classList.remove('glisse');
      const info = GROUPES.flatMap(g => g.onglets).find(o => o.id === courant());
      ordres[roleId + '|' + info.id] = [...x.parent.querySelectorAll(':scope > .mod[data-mod]')].map(c => c.dataset.mod); sauver('pilotage-ordre', ordres);
      noClick = Date.now() + 400; renderApp();
    }, 270);
    noClick = Date.now() + 700;
  }
})();

      <p class="note" style="--i:${info.prevu.length + 1}">Structure seule : ces emplacements recevront le contenu quand les informations seront définies. Astuce : reste appuyé sur une case pour la déplacer. Valeurs, écarts, courbes, objectifs, ancienneté et échéances de la frise (hors consignes) : exemples.${r.provisoire ? ' Les onglets des directeurs sont provisoires.' : ''}</p>
      ${sim ? sim.replace('class="sim"', `class="sim" style="--i:${info.prevu.length + 2}"`) : ''}
      ${simA ? simA.replace('class="sim"', `class="sim" style="--i:${info.prevu.length + 2}"`) : ''}
      ${simE.replace('class="sim"', `class="sim" style="--i:${info.prevu.length + 2}"`)}
    </main>
    <button class="hbtn fab${nbOuv ? ' has' : ''}" id="consbtn" aria-label="Consignes">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.4l2.4 2.4 4.6-5"/></svg>
      <span>${!sup && nbOuv ? nbOuv + (nbOuv > 1 ? ' consignes' : ' consigne') : 'Consignes'}</span>
      ${sup ? `<span class="pillcount">${nbSup}</span>` : (nbOuv ? `<span class="bd rf">${nbOuv}</span>` : '')}
    </button>
  </div>`;
  root.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; }));
  root.querySelectorAll('[data-scope]').forEach(b => b.addEventListener('click', () => { scope = b.dataset.scope; renderApp(); }));
  root.querySelectorAll('.rb').forEach(b => b.addEventListener('click', () => {
    if (Date.now() < noClickRail) return;
    ouvert = b.dataset.pl;
    root.querySelectorAll('.rb').forEach(x => { const o = x.dataset.pl === ouvert; x.classList.toggle('open', o); x.setAttribute('aria-pressed', String(o)); });
    root.querySelectorAll('.pp').forEach(x => x.classList.toggle('open', x.dataset.pl === ouvert));
  }));
  root.querySelectorAll('[data-sim]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sim, etats = [null, ...ROLES[k].onglets];
    presence[k] = etats[(etats.indexOf(presence[k] || null) + 1) % etats.length];
    renderApp();
  }));
  root.querySelectorAll('.mod').forEach(m => {
    const go = () => { if (Date.now() < noClick) return; ouvrirModule(m.dataset.mod, info.id); };
    m.addEventListener('click', go);
    m.querySelectorAll('[data-ext]').forEach(a => a.addEventListener('click', ev => ev.stopPropagation()));
    m.addEventListener('keydown', e => {
      if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        e.preventDefault();
        const lst = ordreCases(info), i = lst.indexOf(m.dataset.mod), j = i + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1);
        if (j < 0 || j >= lst.length) return;
        [lst[i], lst[j]] = [lst[j], lst[i]]; ordres[roleId + '|' + info.id] = lst; sauver('pilotage-ordre', ordres); renderApp();
        const nv = [...document.querySelectorAll('section.modules > .mod')].find(x => x.dataset.mod === lst[j]); if (nv) nv.focus();
        return;
      }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    });
  });
  root.querySelectorAll('[data-al]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.al, a = alertes[t] || {};
    const etat = (a.robot || 0) * 2 + (a.alerte ? 1 : 0), suiv = (etat + 1) % 8;
    alertes[t] = { robot: Math.floor(suiv / 2), alerte: suiv % 2 };
    renderApp();
  }));
  document.getElementById('themebtn').addEventListener('click', () => {
    theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
    try { localStorage.setItem('pilotage-theme', theme); } catch (e) {}
    appliquerTheme();
    document.getElementById('themebtn').textContent = THEMES[theme];
  });
  document.getElementById('datebtn').addEventListener('click', ouvrirDate);
  const ra = document.getElementById('retourauj'); if (ra) ra.addEventListener('click', () => { jourRef = null; renderApp(); });
  root.querySelectorAll('[data-per]').forEach(b => b.addEventListener('click', () => { periode = b.dataset.per; renderApp(); }));
  document.getElementById('cmpbtn').addEventListener('click', () => { comparer = comparer === 'prev' ? 'N-1' : 'prev'; renderApp(); });
  document.getElementById('consbtn').addEventListener('click', ouvrirConsignes);
  document.getElementById('reubtn').addEventListener('click', lancerReunion);
  document.getElementById('reuquit').addEventListener('click', quitterReunion);
  document.getElementById('helpbtn').addEventListener('click', lancerTuto);
  document.getElementById('codebtn').addEventListener('click', ouvrirMonCode);
  const ro = document.getElementById('resetordre'); if (ro) ro.addEventListener('click', () => { delete ordres[roleId + '|' + info.id]; sauver('pilotage-ordre', ordres); renderApp(); });
  root.querySelectorAll('[data-etat]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.etat;
    if (t === 'off') etatsSim.off = !etatsSim.off;
    else if (t === 'auto') { const k = info.id + '|' + info.prevu[0]; if (etatsSim.auto[k]) delete etatsSim.auto[k]; else etatsSim.auto[k] = true; }
    else if (t === 'manque') { const k = cle(info.id, info.prevu[0]); if (etatsSim.manque[k]) delete etatsSim.manque[k]; else etatsSim.manque[k] = true; }
    else if (t === 'chargement') { etatsSim.chargement = true; setTimeout(() => { etatsSim.chargement = false; if (roleId) renderApp(); }, 2600); }
    renderApp();
  }));
  const rg = document.getElementById('regbtn'); if (rg) rg.addEventListener('click', ouvrirReglages);
  document.getElementById('notifbtn').addEventListener('click', activerNotifs);
  document.getElementById('out').addEventListener('click', sortir);
  root.querySelectorAll('[data-jour]').forEach(b => b.addEventListener('click', () => ouvrirJour(b.dataset.jour)));
  if (reunion) majHorloge();
}

/* Bulle sous la souris dans les éléments cliquables. */
root.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('.tab, .rb, .scope button:not(.fixed), .chip, .out, .hbtn, .mod.clic');
  if (!t) return;
  const b = t.getBoundingClientRect();
  t.style.setProperty('--mx', (e.clientX - b.left) + 'px');
  t.style.setProperty('--my', (e.clientY - b.top) + 'px');
});

/* Halo très doux qui suit la souris sur toute la page. */
(function () {
  const halo = document.getElementById('halo');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let x = innerWidth / 2, y = innerHeight / 3, cx = x, cy = y, actif = false;
  addEventListener('pointermove', e => { x = e.clientX; y = e.clientY; if (!actif) { actif = true; cx = x; cy = y; halo.classList.add('on'); loop(); } });
  document.addEventListener('pointerleave', () => halo.classList.remove('on'));
  document.addEventListener('pointerenter', () => { if (actif) halo.classList.add('on'); });
  function loop() {
    cx += (x - cx) * 0.12; cy += (y - cy) * 0.12;
    halo.style.setProperty('--hx', cx + 'px'); halo.style.setProperty('--hy', cy + 'px');
    requestAnimationFrame(loop);
  }
})();

function render() { if (roleId) renderApp(); else { const m = msgLogin; msgLogin = ''; renderLogin(m); } }
window.addEventListener('hashchange', () => { if (roleId) renderApp(); });
(async () => {
  let aJeton = false; try { aJeton = !!localStorage.getItem('pilotage-jeton'); } catch (e) {}
  render();
  if (aJeton && await restaurerSession()) render();
})();
</script>
